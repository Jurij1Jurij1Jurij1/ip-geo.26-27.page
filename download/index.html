<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenos datotek</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 650px;
      width: 100%;
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #111;
    }
    p {
      font-size: 1.05rem;
      color: #555;
      margin-bottom: 25px;
    }
    a {
      color: #0070f3;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f1f5f9;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .file-name {
      font-weight: 500;
      color: #1e293b;
    }
    .btn-download {
      background-color: #0070f3;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .btn-download:hover {
      background-color: #0051a2;
      text-decoration: none;
    }
    .back-link {
      display: inline-block;
      margin-top: 15px;
      color: #64748b;
      font-size: 0.95rem;
    }
    .back-link:hover {
      color: #1e293b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Prenos datotek</h1>
    <p>
      Tukaj si prenesi vse potrebne datoteke, ki jih boš potreboval za opravljanje naloge. Za več informacij klikni tukaj: <a href="/navodila/index.html">navodila</a>.
    </p>

    <!-- Seznam datotek, ki se dinamično napolni iz spodnjega JSON-a -->
    <div id="file-container" class="file-list"></div>

    <a href="/home/index.html" class="back-link">&larr; Nazaj na domačo stran</a>
  </div>

  <!-- Vgrajeni JSON s podatki o datotekah -->
  <script type="application/json" id="files-data">
    [
      {
        "id": "1",
        "ime": "predloga_naloge.zip",
        "povezava": "/files/predloga_naloge.zip"
      }
    ]
  </script>

  <script>
    // Preberemo JSON iz skripte in izrišemo seznam datotek
    const jsonElement = document.getElementById('files-data');
    const files = JSON.parse(jsonElement.textContent);
    const container = document.getElementById('file-container');

    files.forEach(file => {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <span class="file-name">${file.ime}</span>
        <a href="${file.povezava}" class="btn-download" download>Prenesi</a>
      `;
      container.appendChild(item);
    });
  </script>

</body>
</html>

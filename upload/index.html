<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nalaganje naloge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      max-width: 650px;
      width: 100%;
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-top: 20px;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #111;
    }
    p.subtitle {
      color: #666;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
      font-size: 0.95rem;
    }
    input[type="text"],
    input[type="password"],
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
      color: #1f2937;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.1);
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    .hint {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 4px;
    }
    .btn-submit {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 30px;
    }
    .btn-submit:hover {
      background-color: #059669;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #64748b;
      font-size: 0.95rem;
      text-decoration: none;
    }
    .back-link:hover {
      color: #1e293b;
      text-decoration: underline;
    }
    #error-msg {
      color: #dc2626;
      background-color: #ffeeec;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Nalaganje naloge</h1>
    <p class="subtitle">Izpolnite spodnje podatke, priložite zahtevani datoteki in oddajte svoje delo.</p>

    <div id="error-msg"></div>

    <form id="upload-form">
      <!-- Identifikacija -->
      <div class="form-group">
        <label for="password">Geslo</label>
        <input type="password" id="password" required placeholder="Vnesite geslo za dostop">
      </div>

      <div class="form-group">
        <label for="name">Ime</label>
        <input type="text" id="name" required placeholder="Vaše ime">
      </div>

      <div class="form-group">
        <label for="surname">Priimek</label>
        <input type="text" id="surname" required placeholder="Vaš priimek">
      </div>

      <div class="form-group">
        <label for="slug">Slug / ID</label>
        <input type="text" id="slug" maxlength="6" required placeholder="Natančno 6 znakov (npr. ab1234)">
        <div class="hint">Identifikator mora biti pravilen!</div>
      </div>

      <!-- Datoteke -->
      <div class="form-group">
        <label for="file-odt">ODT datoteka (.odt)</label>
        <input type="file" id="file-odt" accept=".odt" required>
      </div>

      <div class="form-group">
        <label for="file-pdf">PDF datoteka (.pdf)</label>
        <input type="file" id="file-pdf" accept=".pdf" required>
      </div>

      <!-- Opombe -->
      <div class="form-group">
        <label for="notes">Opombe (neobvezno)</label>
        <textarea id="notes" placeholder="Če želite karkoli posebnega sporočiti..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Oddaj nalogo</button>
    </form>

    <a href="/home/index.html" class="back-link">&larr; Nazaj na domačo stran</a>
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const errorBox = document.getElementById('error-msg');
    const slugInput = document.getElementById('slug');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorBox.style.display = 'none';

      // Preverjanje dolžine sluga (točno 6 znakov)
      const slugValue = slugInput.value.trim();
      if (slugValue.length !== 6) {
        errorBox.textContent = "Napaka: Slug / ID ni pravilen!";
        errorBox.style.display = 'block';
        slugInput.focus();
        return;
      }

      // Potrditveno okno pred oddajo
      const confirmed = confirm("Ali si prepričan, da želiš oddati nalogo? Tega dejanja kasneje ni mogoče popraviti ali razveljaviti!");
      
      if (!confirmed) {
        return; // Uporabnik je preklical
      }

      // Zbiranje podatkov za kasnejše pošiljanje na Worker
      const formData = new FormData();
      formData.append('password', document.getElementById('password').value);
      formData.append('name', document.getElementById('name').value);
      formData.append('surname', document.getElementById('surname').value);
      formData.append('slug', slugValue);
      formData.append('odtFile', document.getElementById('file-odt').files[0]);
      formData.append('pdfFile', document.getElementById('file-pdf').files[0]);
      formData.append('notes', document.getElementById('notes').value);

      // Tukaj bomo kasneje dodali fetch() za pošiljanje na Cloudflare Worker
      alert("Podatki so pripravljeni za pošiljanje!");
    });
  </script>

</body>
</html>

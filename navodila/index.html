# VREMENSKI DETEKTIVI: ANALIZA VREMENSKIH PODATKOV

**Praktična naloga iz geografije**

Kako se spreminja temperatura v različnih delih leta? Ali je bilo v začetku aprila topleje kot konec septembra? Kako velika je razlika med nočnimi in dnevnimi temperaturami?

V tej nalogi boš postal/-a pravi vremenski detektiv! S pomočjo resničnih vremenskih podatkov boš raziskal/-a temperaturo, vlažnost zraka in padavine, izdelal/-a grafa ter primerjal/-a dve različni obdobji v letu.

Pri delu natančno upoštevaj spodnja navodila.

---

## 1. PRENESI VREMENSKE PODATKE

Najprej potrebuješ podatke, na podlagi katerih boš opravil/-a analizo.

1. Odpri spletno stran: https://geo.treved.dev/download/
2. Na strani poišči in prenesi dve datoteki s surovimi vremenskimi podatki v obliki CSV:
   - podatke za **april**,
   - podatke za **september**.
3. Datoteki shrani v mapo na svojem računalniku, kjer ju boš zlahka našel/-la.

**Pozor!** Datoteki CSV sta na prvi pogled lahko videti nepregledni. Odpri ju v programu za preglednice, na primer LibreOffice Calc, Microsoft Excel ali Google Preglednice. Podatki se bodo tako prikazali v posameznih stolpcih in jih boš lažje pregledoval/-a.

## 2. IZDELAJ POROČILO

Odpri program za urejanje besedil, na primer LibreOffice Writer, Microsoft Word ali Google Dokumenti.

V njem boš pripravil/-a poročilo, dolgo **od 1 do 2 strani**.

Poročilo mora vsebovati naslednje elemente:

### A) Naslov in osebni podatki

Na vrh dokumenta zapiši:
- naslov: **Analiza vremenskih podatkov**,
- ime in priimek,
- razred.

### B) Preglednica z vremenskimi podatki

Iz prenesenih datotek poišči podatke za dneve in ure, ki so navedeni na koncu teh navodil.

V poročilo vstavi preglednico (tabelo) in vanjo prepiši zahtevane podatke.

V preglednici morajo biti za vsak navedeni čas zapisane tri vrednosti:
- **temperatura zraka** (v °C),
- **relativna vlažnost zraka** (v %),
- **količina padavin** (v mm).

Pazi, da podatke prepišeš natančno in da pri tem ne zamenjaš datumov ali ur. V preglednici ne pozabi navesti merskih enot.

### C) Prvi črtni graf – april

Izdelaj črtni graf, ki prikazuje spreminjanje temperature zraka od **5. do 7. aprila** (vključno z obema dnevoma).

Pri izdelavi uporabi samo meritve ob naslednjih urah:
- 00.00,
- 06.00,
- 12.00,
- 18.00.

To pomeni, da moraš uporabiti **12 meritev** (4 meritve na dan).

Graf izdelaj v programu za preglednice (LibreOffice Calc, Excel, Google Preglednice ali podobnem programu).

Pri izdelavi grafa upoštevaj:
- uporabi črtni graf;
- na vodoravni osi (os X) prikaži datum in uro meritve;
- na navpični osi (os Y) prikaži temperaturo v °C;
- grafu dodaj naslov, na primer *Temperatura zraka od 5. do 7. aprila*;
- poskrbi, da bo graf pregleden in da bodo vrednosti ter oznake osi dobro vidne.

Ko je graf končan, ga kopiraj kot sliko in vstavi v poročilo.

### D) Drugi črtni graf – september

Ponovi enak postopek za obdobje **od 25. do 27. septembra** (vključno z obema dnevoma).

Tudi tokrat uporabi samo meritve ob urah 00.00, 06.00, 12.00 in 18.00, torej skupaj 12 meritev.

Graf naj bo izdelan po enakih pravilih kot aprilski:
- črtni graf;
- vodoravna os prikazuje datum in uro;
- navpična os prikazuje temperaturo v °C;
- graf ima ustrezen naslov.

Dokončan graf vstavi v poročilo.

### E) Primerjava in analiza obeh grafov

Zdaj si na vrsti ti! Pozorno si oglej oba grafa in primerjaj spreminjanje temperature v aprilu in septembru.

V poročilu napiši kratek opis, v katerem odgovori na naslednja vprašanja:

**1. Splošna primerjava**
- Kakšne so bile temperature v obeh obdobjih?
- V katerem obdobju je bilo praviloma topleje?
- Ali je temperatura čez dan in med posameznimi dnevi naraščala ali padala?
- Katere druge zanimive razlike opaziš?

**2. Trend spreminjanja temperature**

Ugotovi, kako se je povprečna temperatura spreminjala iz dneva v dan.

Za vsako obdobje izračunaj povprečno dnevno spremembo temperature:
- Za april primerjaj povprečno temperaturo 5. aprila s povprečno temperaturo 7. aprila.
- Za september primerjaj povprečno temperaturo 25. septembra s povprečno temperaturo 27. septembra.

Pri izračunu uporabi vse štiri meritve posameznega dne (00.00, 06.00, 12.00 in 18.00).

Razliko med povprečno temperaturo zadnjega in prvega dne deli z dvema, saj sta med njima dva enodnevna presledka.

Zapiši, ali je temperatura v povprečju naraščala ali padala in za koliko °C na dan.

**3. Dnevno nihanje temperature**

Ugotovi, kolikšna je bila povprečna razlika med temperaturo ob polnoči (00.00) in poldnevu (12.00).

- Za april izračunaj povprečno razliko za 5., 6. in 7. april.
- Za september izračunaj povprečno razliko za 25., 26. in 27. september.

Pri tem za vsak dan od temperature ob 12.00 odštej temperaturo ob 00.00. Nato izračunaj povprečje treh dobljenih razlik.

Rezultate za obe obdobji zapiši v °C in jih primerjaj.

**Pomembno:** Pri analizi ne zadošča, da napišeš samo končne številke. S svojimi besedami pojasni tudi, kaj ti izračuni povedo o spreminjanju temperature.

## 3. PREVERI IN SHRANI POROČILO

Pred shranjevanjem preveri, ali tvoje poročilo vsebuje:
- naslov, ime, priimek in razred;
- preglednico z vsemi zahtevanimi podatki;
- oba črtna grafa;
- primerjavo in opis obeh obdobij;
- izračun povprečne dnevne spremembe temperature za april in september;
- izračun povprečne razlike med polnočjo in poldnevom za obe obdobji;
- dovolj praznega prostora na koncu dokumenta za podpis.

Ko je poročilo končano, ga shrani v **dveh različnih oblikah**:

1. **ODT** – besedilni dokument (OpenDocument Text).
2. **PDF** – dokument v obliki PDF.

Obe datoteki shrani na računalnik. Priporočamo, da ju poimenuješ pregledno, na primer:
- `Priimek_Ime_Vremenski_podatki.odt`
- `Priimek_Ime_Vremenski_podatki.pdf`

## 4. PODPIŠI PDF-DOKUMENT

Svoj PDF-dokument moraš tudi lastnoročno podpisati.

1. Odpri shranjeni PDF-dokument. Priporočamo uporabo brskalnika Google Chrome, lahko pa uporabiš tudi drug program za pregledovanje in označevanje PDF-datotek.
2. Na koncu dokumenta poišči prazen prostor, ki si ga predvidel/-a za podpis.
3. Z orodjem za risanje oziroma pisanje se podpiši z miško ali sledilno ploščico.

Podpis ni treba, da je popoln ali zelo natančen. Pomembno je, da je simboličen in da je razvidno, da si dokument podpisal/-a sam/-a.

4. Podpisani PDF ponovno shrani. Preveri, ali je podpis v dokumentu res ostal shranjen!

**Pozor:** Oddati moraš podpisano različico PDF-dokumenta, ne nepodpisane.

## 5. ODDAJ SVOJO NALOGO

Ko imaš pripravljeni obe datoteki, ju moraš oddati prek spletnega obrazca.

1. Odpri spletno stran: https://geo.treved.dev/upload/
2. V obrazec vnesi uporabniško ime oziroma ID in geslo, ki ju prejmeš od odgovorne osebe.
3. Naloži obe datoteki:
   - končni dokument **ODT**,
   - podpisani dokument **PDF**.
4. Preveri, ali si izbral/-a pravi datoteki.
5. Potrdi oddajo in počakaj na potrditev, da je bila naloga uspešno oddana.

**Zelo pomembno!** Nalogo lahko oddaš samo enkrat. Vrednotila se bo izključno prva oddaja, zato pred potrditvijo še enkrat preveri, ali sta obe datoteki pravilni in ali je PDF podpisan.

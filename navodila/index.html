<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navodila</title>
  <!-- Uvoz marked.js za pretvorbo Markdown -> HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.7;
      color: #333;
      background-color: #f8f9fa;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      max-width: 750px;
      width: 100%;
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-top: 20px;
      margin-bottom: 40px;
    }
    /* Oblikovanje pretvorjenega Markdown besedila */
    .markdown-body h1 {
      font-size: 1.8rem;
      margin-bottom: 16px;
      color: #111;
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 8px;
    }
    .markdown-body h2 {
      font-size: 1.4rem;
      margin-top: 24px;
      margin-bottom: 12px;
      color: #222;
    }
    .markdown-body h3 {
      font-size: 1.15rem;
      margin-top: 20px;
      margin-bottom: 8px;
      color: #333;
    }
    .markdown-body p {
      margin-bottom: 16px;
      color: #444;
    }
    .markdown-body ul, .markdown-body ol {
      margin-bottom: 16px;
      padding-left: 24px;
      color: #444;
    }
    .markdown-body li {
      margin-bottom: 6px;
    }
    .markdown-body code {
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
    }
    .markdown-body pre {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    .markdown-body pre code {
      background-color: transparent;
      color: inherit;
      padding: 0;
    }
    .markdown-body blockquote {
      border-left: 4px solid #0070f3;
      padding-left: 16px;
      color: #666;
      font-style: italic;
      margin-bottom: 16px;
    }
    .markdown-body a {
      color: #0070f3;
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
    }
    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #64748b;
      font-size: 0.95rem;
      text-decoration: none;
    }
    .back-link:hover {
      color: #1e293b;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tukaj se bo izrisal pretvorjen Markdown -->
    <div id="content" class="markdown-body"></div>

    <a href="/home/index.html" class="back-link">&larr; Nazaj na domačo stran</a>
  </div>

  <!-- Tvoje Markdown besedilo znotraj oznake script -->
  <script type="text/markdown" id="markdown-content">
# Navodila za reševanje naloge

Dobrodošli v podrobnih navodilih. Spodaj so opisani vsi koraki, ki jih morate opraviti.

## 1. Korak: Prenos datotek
Prvo pojdite na stran za [prenos datotek](/download/index.html) in prenesite potrebne predloge.

## 2. Korak: Obdelava
Nalogo rešite v svojem lokalnem okolju. Pazite na naslednje zahteve:
* Datoteke morajo biti v formatu `.zip` ali `.pdf`.
* Ime datoteke naj vsebuje vaše ime (npr. `priimek_ime_naloga.zip`).

> **Opozorilo:** Ne pozabite preveriti ustreznosti podatkov pred končnim nalaganjem!

## 3. Korak: Nalaganje
Ko končate, pojdite na podstran za **nalaganje** ter oddajte svoje delo.

### Vzorčna koda (primer)
</script>

  <script>
    // Preberemo Markdown besedilo in ga pretvorimo v HTML preko marked.js
    const rawMarkdown = document.getElementById('markdown-content').textContent;
    document.getElementById('content').innerHTML = marked.parse(rawMarkdown);
  </script>

</body>
</html>
